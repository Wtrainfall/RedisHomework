services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis-cache
    ports:
      - "6379:6379"      # Redis 服务端口
      - "8001:8001"      # RedisInsight Web GUI
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: social-cache-app
    ports:
      - "5000:5000"      # Flask Web 端口
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./run.py:/app/run.py
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_PATH=/app/data/social.db
      - FLASK_ENV=development
    command: python run.py

volumes:
  redis_data: